name: Android offline PoC
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/poc/**'
      - '.github/workflows/android-poc.yml'
permissions:
  contents: read
concurrency:
  group: android-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public source at tested merge SHA
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Compile, sign and verify offline demonstration APK
        shell: bash
        run: bash android/poc/build.sh
      # Artifact handoff is enabled only for explicitly requested builds to avoid recurring storage use.
