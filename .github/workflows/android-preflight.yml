name: Android preflight (free runner)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-preflight.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check preinstalled build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          command -v gradle || echo "Gradle not on PATH"
          command -v adb || echo "ADB not on PATH"
          command -v sdkmanager || echo "sdkmanager not on PATH"
          sdk=""
          for candidate in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
            if test -n "$candidate" && test -d "$candidate"; then sdk="$candidate"; break; fi
          done
          if test -z "$sdk"; then echo "No preinstalled Android SDK at expected locations"; exit 2; fi
          echo "SDK: $sdk"
          for part in platforms build-tools platform-tools cmdline-tools; do
            if test -d "$sdk/$part"; then ls -1 "$sdk/$part"; else echo "Missing: $part"; fi
          done
          test -d "$sdk/platforms"
          test -d "$sdk/build-tools"
          test -x "$sdk/platform-tools/adb" && "$sdk/platform-tools/adb" version || true
          if test -r /dev/kvm; then echo "KVM readable"; else echo "KVM not readable"; fi
          echo "Preflight only: no checkout, cache, artifact or deployment."
