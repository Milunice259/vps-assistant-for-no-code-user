name: One-shot authorized merged-branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-merged-branches-once.yml']
permissions:
  contents: write
concurrency:
  group: authorized-merged-branch-cleanup
  cancel-in-progress: false
jobs:
  delete-exact-merged-refs:
    if: github.repository == 'Milunice259/vps-assistant-for-no-code-user' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify merged ancestry and delete only the five owner-authorized branch heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile, urllib.request, urllib.error, urllib.parse, shutil
          REPO='Milunice259/vps-assistant-for-no-code-user'
          EXPECTED={
            'feature/android-ui-refresh':('7695a4e1893624cb3eccf18e41c59276d4ea3348',2),
            'feature/android-widget':('2957774e8a1d73f07844336f60e8492f060dab56',1),
            'feature/owner-signing-wizard':('93292d5eb88a98e46a63d87f42a9397503c51e62',3),
            'feature/widget-customization':('13021c1659e257bc69743eb9eb7ce3b4f887a892',5),
            'fix/android-release-tools':('906b33efbc01fc9d6a13f9c9e848b31e2e89f54c',4),
          }
          def api(path, missing=False):
            req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
            except urllib.error.HTTPError as e:
              if missing and e.code==404:return None
              raise RuntimeError('GitHub request failed, HTTP '+str(e.code)) from None
          def run(args, **kw):
            p=subprocess.run(args,check=False,text=True,capture_output=True,timeout=65,**kw)
            if p.returncode:raise RuntimeError('Git operation failed: '+p.stderr[-1800:])
            return p.stdout
          repo=api('')
          assert repo['full_name']==REPO and repo['default_branch']=='main' and not repo['private']
          open_prs=api('pulls?state=open&per_page=100')
          assert len(open_prs)<100
          assert not any(p['head']['ref'] in EXPECTED or p['base']['ref'] in EXPECTED for p in open_prs)
          for branch,(sha,number) in EXPECTED.items():
            pr=api('pulls/'+str(number))
            assert pr['merged'] and pr['state']=='closed' and pr['base']['ref']=='main'
            assert pr['head']['ref']==branch and pr['head']['sha']==sha
            info=api('branches/'+urllib.parse.quote(branch,safe=''),missing=True)
            if info is not None:
              assert info['commit']['sha']==sha and not info['protected'],branch
          work=pathlib.Path(tempfile.mkdtemp(prefix='authorized-branch-cleanup-',dir=os.environ['RUNNER_TEMP']))
          try:
            run(['git','init',str(work)])
            run(['git','-C',str(work),'remote','add','origin','https://github.com/'+REPO+'.git'])
            run(['git','-C',str(work),'fetch','--no-tags','origin','+refs/heads/*:refs/remotes/origin/*'])
            before=run(['git','-C',str(work),'ls-remote','--heads','--tags','origin'])
            protected={ref:sha for sha,ref in (line.split() for line in before.splitlines()) if ref not in {'refs/heads/'+b for b in EXPECTED}}
            main=run(['git','-C',str(work),'rev-parse','origin/main']).strip()
            active=[]
            for branch,(sha,_) in EXPECTED.items():
              run(['git','-C',str(work),'merge-base','--is-ancestor',sha,main])
              ref='refs/heads/'+branch
              values={r:s for s,r in (line.split() for line in before.splitlines())}
              if ref in values:
                assert values[ref]==sha
                active.append(branch)
            # The private token flows only to Git's credential pipe, never into source or logs.
            askpass=work/'askpass.py'
            askpass.write_text('#!/usr/bin/env python3\nimport os,sys\nprint("x-access-token" if "Username" in sys.argv[1] else os.environ["GH_TOKEN"])\n')
            askpass.chmod(0o700)
            env=dict(os.environ,GIT_TERMINAL_PROMPT='0',GIT_ASKPASS=str(askpass))
            if active:
              args=['git','-C',str(work),'push','--atomic','--porcelain']
              args+=['--force-with-lease=refs/heads/'+b+':'+EXPECTED[b][0] for b in active]
              args+=['origin']+[':refs/heads/'+b for b in active]
              print(run(args,env=env))
            after=run(['git','-C',str(work),'ls-remote','--heads','--tags','origin'])
            remaining={ref:sha for sha,ref in (line.split() for line in after.splitlines())}
            for ref,sha in protected.items():assert remaining.get(ref)==sha,ref
            for branch in EXPECTED:
              assert 'refs/heads/'+branch not in remaining,branch
              assert api('branches/'+urllib.parse.quote(branch,safe=''),missing=True) is None,branch
            print('PASS: five authorized merged branches absent; main and all tag refs unchanged.')
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Owner-authorized deletion of five merged branch heads completed. Main and all tags preserved.\n\n')
              for branch,(sha,number) in EXPECTED.items():out.write('- '+branch+' ('+sha+', merged PR #'+str(number)+')\n')
          finally:
            shutil.rmtree(work)
          PY
